name: OTS ANCHOR

# The trustless clock, hosted.
#
# WHY THIS EXISTS: `ots stamp` failed on the desk machine 2026-08-01 with
# `TypeError: argument of type 'NoneType' is not iterable` out of
# python-bitcoinlib's bitcoin/core/key.py. Cause is Windows-specific:
# ctypes.util.find_library('ssl') returns None because CPython for Windows
# ships libcrypto-3.dll / libssl-3.dll inside its own DLLs folder under names
# find_library does not match, and there is no system OpenSSL. The library
# passes that None straight into LoadLibrary. Nothing to do with the network,
# and nothing to do with the Python version - the tool's own hint about
# 3.12/3.13 is wrong for this failure mode.
#
# On ubuntu-latest python-bitcoinlib imports without complaint (verified,
# 0.12.2). So the fix is not to repair Windows; it is to stamp where OpenSSL
# already lives.
#
# It is also better doctrine. RPAS 4.05 wants a clock the operator does not
# hold. Stamping from the operator's own machine satisfies that only because
# Bitcoin does; stamping from CI adds a second party to the chain of custody
# who is not the operator either.
#
# TWO PHASES, AND THE HONEST NAMES FOR THEM:
#   stamp   -> PENDING. Calendar servers have the digest and promise inclusion
#              in a future block. Proves the calendars saw it. Proves NO block
#              height. Must be labelled pending.
#   upgrade -> ANCHORED. The receipt now carries a Bitcoin attestation and a
#              stranger can verify it against their own view of the chain,
#              trusting neither this desk nor the calendars.
# Aggregation takes hours. The daily schedule below exists so the upgrade
# happens whether or not anyone remembers to run it.

on:
  workflow_dispatch:
  schedule:
    # 04:41 UTC - off the hour, which is the most congested scheduler slot.
    - cron: "41 4 * * *"

permissions:
  contents: write

concurrency:
  group: ots-anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the ots client
        run: pip install opentimestamps-client

      - name: Prove the client starts before claiming anything
        run: |
          set -euo pipefail
          python -c "import bitcoin.core.key; print('python-bitcoinlib OK')"
          ots --version || true

      - name: Stamp anything not yet stamped
        run: python ots_anchor.py --stamp || true

      - name: Upgrade pending receipts
        run: python ots_anchor.py --upgrade || true

      - name: Report the real state
        run: python ots_anchor.py --status

      - name: Commit receipts and state
        run: |
          set -euo pipefail
          git config user.name  "ots[bot]"
          git config user.email "ots@retroprescientaudit.com"

          # Narrow add. Receipts and the state file only - nothing else in the
          # tree is this job's to touch, and a narrow add is what keeps it from
          # colliding with a local publish that ran `git add -A`.
          git add -A 'docs/*.ots' docs/ots_anchors.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "no receipt change to record"
            exit 0
          fi
          git commit -m "ots: anchor pass $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebasing and retrying"
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Verify from the remote, not the console
        run: |
          git fetch origin main --quiet
          echo "remote main is now $(git rev-parse --short origin/main)"
