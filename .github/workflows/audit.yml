name: AUDIT

# The desk's own defect rate, recomputed on a clock the operator does not
# hold and committed under GitHub's identity. Same reasoning as SPION: an
# instrument that only self-reports when asked is an instrument that reports
# when the answer is convenient.
#
# 41 past the hour, daily. Off the top of the hour on purpose, and off
# SPION's :17 slot so the two do not race for the same push.
#
# SCOPE LIMITATION, stated here because CI cannot state it for itself:
# ident_audit runs WITHOUT --packets, because forecasts/kkr_packet_*.md is in
# .gitignore and the runner never sees them. Its UNSOURCED findings are
# therefore "not present in the published record", not "invented", and the
# report it writes says so in its own scope block. MALFORMED findings stand
# regardless. The operator's local run with --packets is the adjudicating
# one; this is the published floor.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Citation integrity
        run: |
          python cite_integrity.py \
            --report CITE_INTEGRITY_latest.md \
            --json cite_integrity_latest.json > /dev/null

      - name: Identifier groundedness
        run: |
          python ident_audit.py \
            --report IDENT_AUDIT_latest.md \
            --json ident_audit_latest.json > /dev/null

      - name: Sync to the served surface
        run: |
          set -euo pipefail
          cp CITE_INTEGRITY_latest.md docs/ 2>/dev/null || true
          cp IDENT_AUDIT_latest.md    docs/ 2>/dev/null || true
          cp cite_integrity_latest.json docs/ 2>/dev/null || true
          cp ident_audit_latest.json    docs/ 2>/dev/null || true

      - name: Commit the findings
        run: |
          set -euo pipefail
          git config user.name  "audit[bot]"
          git config user.email "audit@retroprescientaudit.com"

          # Narrow add. Nothing else in the tree is ours to touch, and a wide
          # add is what would collide with a local push mid-session.
          git add CITE_INTEGRITY_latest.md cite_integrity_latest.json \
                  IDENT_AUDIT_latest.md    ident_audit_latest.json \
                  docs/CITE_INTEGRITY_latest.md docs/cite_integrity_latest.json \
                  docs/IDENT_AUDIT_latest.md    docs/ident_audit_latest.json

          if git diff --cached --quiet; then
            echo "no change in the defect rate"
            exit 0
          fi

          DEF=$(python -c "import json;d=json.load(open('cite_integrity_latest.json'));print(f\"{d['defective']}/{d['audited']}\")")
          IDS=$(python -c "import json;d=json.load(open('ident_audit_latest.json'));print(len(d['sealed']))")
          git commit -m "audit: $(date -u +%Y-%m-%dT%H:%MZ) — citations ${DEF} defective, ${IDS} sealed row(s) carrying a flagged identifier"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebasing and retrying"
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Verify from the remote, not the console
        run: |
          git fetch origin main --quiet
          echo "remote main is now $(git rev-parse --short origin/main)"
