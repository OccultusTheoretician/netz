name: SPION

# The quiet channel, hosted. Runs whether or not the desk machine is awake,
# and commits under GitHub's identity rather than the operator's — which is
# the point: the observation timestamps come from a clock he does not hold.
#
# Cron here is best-effort. GitHub delays and occasionally drops scheduled
# runs under platform load, so every record this writes is "observed at",
# never "checked at exactly". The published face says so.
#
# :17 past the hour on purpose — top-of-hour is the most congested slot on
# the shared scheduler and the most likely to be deferred.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spion
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the watch
        run: python spion_ci.py

      - name: Commit the observation
        run: |
          set -euo pipefail
          git config user.name  "spion[bot]"
          git config user.email "spion@users.noreply.github.com"

          # Only these two paths. Nothing else in the tree is ours to touch,
          # and a narrow add is what keeps this from colliding with a local
          # push that ran a `git add -A`.
          git add docs/spion_state.json docs/spion_log.json spion_pending.json

          if git diff --cached --quiet; then
            echo "no change to record"
            exit 0
          fi

          MOVED=$(python -c "import json;print(json.load(open('docs/spion_state.json'))['counts']['moved'])")
          git commit -m "spion: observation $(date -u +%Y-%m-%dT%H:%MZ) (${MOVED} moved)"

          # The desk machine pushes to this branch too. Rebase, retry, and
          # fail loudly rather than force anything.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebasing and retrying"
            git pull --rebase --autostash origin main
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      - name: Verify from the remote, not the console
        run: |
          git fetch origin main --quiet
          echo "remote main is now $(git rev-parse --short origin/main)"
