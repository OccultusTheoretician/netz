<text x="90" y="726" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" letter-spacing="5" fill="#c9a227">PALETTE</text>
<rect x="90" y="742" width="205" height="96" fill="#0f1216" stroke="#2a2f36"/><text x="90" y="866" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#cfd3d8">ink</text><text x="90" y="890" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#7d838c">#0f1216</text><text x="90" y="914" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5f656d">head, body, wing</text><rect x="335" y="742" width="205" height="96" fill="#b3b9b3" stroke="#2a2f36"/><text x="335" y="866" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#cfd3d8">grey</text><text x="335" y="890" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#7d838c">#b3b9b3</text><text x="335" y="914" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5f656d">panels and neck trim</text><rect x="580" y="742" width="205" height="96" fill="#eef1f5" stroke="#2a2f36"/><text x="580" y="866" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#cfd3d8">light</text><text x="580" y="890" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#7d838c">#eef1f5</text><text x="580" y="914" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5f656d">the eye slit, and nothing else</text><rect x="825" y="742" width="205" height="96" fill="#0e0f11" stroke="#2a2f36"/><text x="825" y="866" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#cfd3d8">plate</text><text x="825" y="890" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#7d838c">#0e0f11</text><text x="825" y="914" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5f656d">site ground</text><rect x="1070" y="742" width="205" height="96" fill="#c9a227" stroke="#2a2f36"/><text x="1070" y="866" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#cfd3d8">brass</text><text x="1070" y="890" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#7d838c">#c9a227</text><text x="1070" y="914" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5f656d">rules, ticks, the sweep</text><rect x="1315" y="742" width="205" height="96" fill="#dcb65e" stroke="#2a2f36"/><text x="1315" y="866" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#cfd3d8">brass lit</text><text x="1315" y="890" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#7d838c">#dcb65e</text><text x="1315" y="914" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#5f656d">hover and emphasis</text>
<line x1="90" y1="952" x2="1510" y2="952" stroke="#2a2f36"/>
<text x="90" y="994" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" letter-spacing="5" fill="#c9a227">RULES</text>
<text x="90" y="1030" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#cfd3d8">Clear space on every side equals the height of the eye slit. Nothing enters it.</text>
<text x="90" y="1058" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#cfd3d8">Below 64px use the small variant. The primary&#8217;s trim goes sub-pixel and the fog turns to mud.</text>
<text x="90" y="1086" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#cfd3d8">Never stretch. Aspect is 729:300. Never recolour, never outline, never add a shadow inside the artwork.</text>
<text x="90" y="1114" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#7d838c">Every file is generated from one vertex table. Edit mark_build.py and regenerate; never edit an SVG by hand.</text>
</svg>
